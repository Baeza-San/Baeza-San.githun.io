<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<title>NekoDonas</title>
<link rel="icon" type="image/png" href="ICONEKO.png">


<style>
body{
    margin:0;
    font-family: 'Poppins', sans-serif;
    background:#F8B6C5;
    color:#5B3B6F;
}

/* PORTADA */
.portada{
    position:relative;
}

.portada img{
    width:100%;
    display:block;
}

/* PERFIL */
.perfil{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid #F8B6C5;
    position:absolute;
    left:50%;
    bottom:-60px;
    transform:translateX(-50%);
    overflow:hidden;
    background:white;
}

.perfil img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* INFO */
.info{
    margin-top:12px;
    text-align:center;
    padding:15px;
    background:#FDE8C8;
}

.info h1{
    margin:0px;
    color:#E64B9A;
    font-size:28px;
}

.info p{
    margin:3px;
    font-size:14px;
}

/* PRODUCTOS */
.productos{
    padding:15px;
}

.card{
    background:white;
    border-radius:20px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    border-radius:15px;
}

.card h3{
    margin:10px 0;
}

.boton{
    display:block;
    text-align:center;
    background:#7ED6D0;
    color:white;
    text-decoration:none;
    padding:12px;
    border-radius:12px;
    font-weight:bold;
    margin-top:10px;
}

.boton:hover{
    background:#5B3B6F;
}

/* COMENTARIOS */
.comentarios{
    background:#FDE8C8;
    padding:20px;
    text-align:center;
}
</style>
</head>

<body>

<div class="portada">
    <img src="PORNEKODONAS.png" alt="Portada NekoDonas">
    
    <div class="perfil">
        <img src="ICONEKO.png" alt="Logo NekoDonas">
    </div>
</div>

<div class="info">
    <h1>.</h1>
    <h1>NekoDonas</h1>
    <div class="contacto">
    <p><i class="fa-brands fa-facebook"></i> NekoDonas</p>
    <p><i class="fa-solid fa-phone"></i> 982 319 6813</p>
</div>

</div>

<div class="productos">

    <div class="card">
        <img src="individual.png">
        <h3>Mini Dona Individual $6 pesos</h3>
        <a class="boton" 
        href="https://wa.me/529615386400?text=Hola,%20quiero%20la%20Mini%20Dona%20Individual" 
        target="_blank">
        Pedir por WhatsApp
        </a>
    </div>

    <div class="card">
        <img src="brocheta.png">
        <h3>Brocheta (3 mini donas) $16 pesos</h3>
        <a class="boton" 
        href="https://wa.me/529615386400?text=Hola,%20quiero%20la%20Brocheta%20de%203%20mini%20donas" 
        target="_blank">
        Pedir por WhatsApp
        </a>
    </div>

    <div class="card">
        <img src="cajas.png">
        <h3>Caja Especial (6 piezas) $40 pesos</h3>
        <a class="boton" 
        href="https://wa.me/529615386400?text=Hola,%20quiero%20la%20Caja%20Especial%20de%206%20donas" 
        target="_blank">
        Pedir por WhatsApp
        </a>
    </div>

</div>

<div class="comentarios">
    <h2>Comentarios</h2>
    <p>Déjanos tu opinión</p>
</div>

</body>
</html>
