<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ubicación en Mapa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"/>
    <style>
        #map {
            height: 100vh;
            width: 100%;
        }

        .leaflet-popup-content {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
<script>
    // Coordenadas centradas en Champotón (puedes cambiarlo)
    const map = L.map('map').setView([19.3576, -90.7171], 13);

    // Agrega el mapa base
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Evento para capturar clics en el mapa
    map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(6);
        const lng = e.latlng.lng.toFixed(6);

        // Muestra las coordenadas en un popup
        L.popup()
            .setLatLng(e.latlng)
            .setContent(`📍 Coordenadas:<br>Lat: ${lat}<br>Lng: ${lng}`)
            .openOn(map);

        console.log(`Coordenadas seleccionadas: ${lat}, ${lng}`);
    });
</script>

</body>
</html>
